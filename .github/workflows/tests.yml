name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # nightly full matrix (incl. Windows) at 07:00 UTC (~03:00 ET)
    - cron: "0 7 * * *"

jobs:
  # Windows on hosted runners is I/O-bound-slow (~10 min vs ~30s elsewhere) because
  # the suite churns hundreds of on-disk temp SQLite DBs. Skip it on plain pushes for
  # fast feedback; run the FULL matrix on PRs, the nightly schedule, and manual runs.
  config:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  unittest:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # memsom is stdlib-only: no pip install of any dependency.
      # TestEndToEndDemo (frozen core) skips itself when the seeded vault
      # note isn't present — expected on CI runners.
      #
      # Timed (PLAN.md Sec6 Phase 11: "Windows full-suite wall time <= 3x
      # Linux, or a written residual with a number in it") -- elapsed wall
      # time is written to suite_seconds.txt and uploaded as an artifact;
      # the perf-ratio job below is where the two OSes' numbers actually
      # get compared, since a single job only ever sees its own OS.
      - name: Run test suite
        # -s tests, not -s . (Phase 0, MEASURED 2026-08-10): with the isolation
        # pin (tests/_isolation.py) wired into tests/__init__.py, "-s ." walks
        # memsom/ (a package, sorts before "tests") to fetch its __path__ before
        # it ever reaches tests/__init__.py — freezing memsom.DATA_DIR at the
        # REAL store first. The guard correctly refuses rather than silently
        # writing to it. No test_*.py exists outside tests/, so scoping the
        # start dir there is exactly equivalent coverage, not a narrower run.
        id: timed_suite
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          python -W error::DeprecationWarning -m unittest discover -s tests -t . -p "test_*.py" -v
          rc=$?
          set -e
          end=$(date +%s)
          echo "$((end-start))" > suite_seconds.txt
          exit $rc

      - name: Upload suite timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timing-${{ matrix.os }}
          path: suite_seconds.txt

      # The frozen core regression gate must pass on its own as well.
      - name: Frozen core regression gate
        run: python -W error::DeprecationWarning -m unittest discover -s tests -p "test_memsom.py" -v

      # Gate #3 broker entry point boots and enforces allow -> taint -> deny.
      - name: Gate 3 broker selfcheck
        run: python -m memsom.federation.broker --selfcheck

      # Some test modules are pytest-style (fixtures/parametrize/xfail) and
      # self-skip under the stdlib-only discover above — pytest is installed
      # LAST so every earlier gate still runs in a stdlib-only interpreter.
      # The module list is DERIVED (grep), so a new pytest-style file joins
      # this step automatically instead of silently joining the skipped set.
      - name: Pytest-style modules
        shell: bash
        run: |
          python -m pip install --quiet pytest
          files=$(grep -l "import pytest" tests/test_*.py)
          if [ -z "$files" ]; then
            echo "::error::grep found no pytest-style modules but this step exists — list derivation broke"
            exit 1
          fi
          echo "$files"
          python -W error::DeprecationWarning -m pytest -q $files

  # ---------------------------------------------------------------------
  # PLAN.md Sec6 Phase 11 ("bootstrap and three-OS CI"): the bootstrap
  # contract -- a friend-beta tester's actual first five minutes -- proven
  # on every OS in the matrix, not just read as code. `memsom` is installed
  # via `pip install -e .` (not through bootstrap.py's own pipx/venv path)
  # so the smoke commands below have a reliable console script on PATH
  # regardless of which installer bootstrap.py chose; bootstrap.py's own
  # install/wire path is still exercised and its own exit code checked,
  # independently, in the first step.
  # ---------------------------------------------------------------------
  bootstrap-contract:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install memsom (console script on PATH for the smoke steps)
        run: python -m pip install -e .

      - name: Pin an isolated data dir (never ~/.memdag)
        shell: bash
        run: |
          echo "MEMDAG_HOME=${{ runner.temp }}/memsom_bootstrap_contract" >> "$GITHUB_ENV"
          echo "MEMDAG_DB=${{ runner.temp }}/memsom_bootstrap_contract/memdag.db" >> "$GITHUB_ENV"

      # --dry-run does NOT exist (the flag is --print-only); --no-ingest is
      # required or bootstrap.py:237's input() blocks on stdin and hangs CI.
      - name: bootstrap.py --print-only --no-ingest (MEASURED EXIT=0 required)
        shell: bash
        run: python bootstrap.py --print-only --no-ingest --data-dir "$MEMDAG_HOME/bootstrap" < /dev/null

      - name: memsom setup --non-interactive
        shell: bash
        run: memsom setup --non-interactive --answers ci/setup_local.json

      - name: init, add, ask, bridge-render, doctor smoke (PLAN.md Sec6 Phase 11 exit gate)
        shell: bash
        run: |
          mkdir -p "$MEMDAG_HOME/render"
          memsom init && \
          memsom add "bootstrap-contract smoke fact" --channel user && \
          memsom ask "smoke fact" && \
          memsom bridge-render "$MEMDAG_HOME/render" && \
          memsom doctor --json

  # ---------------------------------------------------------------------
  # Architectural contracts. `.importlinter` documents itself as ENFORCED
  # ("a break is a bug"). `memsom-layers` (the strict 9-rank total order,
  # PLAN.md Sec1.1) is now IN this file -- Phase 7 ("the layers land")
  # deleted `.importlinter-goals`, the aspirational file this used to be
  # ratcheted against, and made the target itself the law.
  #
  # Invoked as the console script ON PURPOSE. MEASURED on the dev box:
  # `python -m importlinter.cli lint-imports` prints NOTHING and exits 0,
  # i.e. a permanently, silently green gate. Same note as the panel repo's
  # ci.yml.
  #
  # Fails loudly if the config is missing rather than passing -- a gate that
  # cannot find its rules must not report success.
  # ---------------------------------------------------------------------
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install import-linter
        run: python -m pip install --upgrade pip && python -m pip install import-linter

      # include_external_packages = True in .importlinter means the graph
      # builder must be able to import the package itself.
      - name: Install memsom
        run: python -m pip install -e .

      - name: Import contracts (enforced)
        shell: bash
        run: |
          if [ ! -f .importlinter ]; then
            echo "::error::.importlinter is not tracked. It exists on the dev box"
            echo "::error::but was never committed. Run: git add .importlinter"
            exit 1
          fi
          lint-imports --config .importlinter

  # The two AST gates `.importlinter` cannot see (PLAN.md Sec1.6): it parses
  # `import` statements, so a second read pool that builds its own WHERE
  # clause, or a second write path that opens `nodes`/`edges` directly, is a
  # legal import and a total silent bypass of the trust model. Both are
  # ratchets seeded in Phase 0 and wired into CI here in Phase 7 ("the layers
  # land"), per that phase's own exit gate.
  ast-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: One read-pool builder outside the primitive
        run: python scripts/gate_readpool.py --check

      - name: One write owner for nodes/edges outside the write path
        run: python scripts/gate_writeowner.py --check

      - name: No env reads outside tuning.py
        run: python scripts/env_ratchet.py --check

      - name: Every broad except is adjudicated
        run: python scripts/failopen_annotations.py --check

      - name: RMW writers are guarded or adjudicated
        run: python scripts/writer_census.py --check

      - name: Effects boxed -- sqlite3.connect sites
        run: python scripts/effects_ratchet.py --check

      - name: Effects boxed -- subprocess connect sites
        run: python scripts/effects_ratchet.py --connect --check

      - name: Effects boxed -- spawns without timeout
        run: python scripts/effects_ratchet.py --timeouts --check

      - name: No upward imports
        run: python scripts/upward_imports.py --check

      - name: Baselines only improve or hold
        run: python scripts/clean_baselines.py --check

      - name: No mutual subpackage import pairs
        run: python scripts/mutual_pairs.py | grep -q 'TOTAL PAIRS 0'

  # ---------------------------------------------------------------------
  # PLAN.md Sec6 Phase 11's perf requirement: "Windows full-suite wall time
  # <= 3x Linux, or a written residual with a number in it." A single-OS
  # session cannot itself produce this comparison (see A-20,
  # scripts/perf_ratio_gate.py's own docstring) -- this job is the actual
  # enforcement point, comparing the two real numbers the `unittest` job's
  # matrix legs each recorded. Only meaningful when windows-latest is in
  # the matrix (PR / schedule / manual, not a plain push).
  # ---------------------------------------------------------------------
  perf-ratio:
    needs: [config, unittest]
    if: contains(needs.config.outputs.os, 'windows-latest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: suite-timing-ubuntu-latest
          path: timing/linux

      - uses: actions/download-artifact@v4
        with:
          name: suite-timing-windows-latest
          path: timing/windows

      - name: Enforce Windows <= 3x Linux full-suite wall time
        run: >
          python scripts/perf_ratio_gate.py --check
          --linux timing/linux/suite_seconds.txt
          --windows timing/windows/suite_seconds.txt

  # Server-side enforcement of the author-identifying-token gate across ALL git
  # history. The pre-push hook (.githooks/pre-push) is opt-in per clone and never
  # runs on a contributor's (or fork PR author's) machine — this job is where the
  # gate actually holds for everyone. Runs on push AND pull_request by design.
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the scan needs every commit, not a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan full git history for author-identifying leaks
        run: python scripts/history_scan.py --all

  # ---------------------------------------------------------------------
  # Coverage MEASUREMENT (2026-09-01). Until this job existed the
  # "well-tested" claim had a test:source file ratio behind it (0.72:1) and
  # no number — a ratio is breadth, not coverage. This job produces the number,
  # renders it in the run's job summary, attaches the html/xml report as an
  # artifact, and holds a FLOOR on it.
  #
  # ubuntu ONLY, deliberately. The windows matrix leg already costs ~24 min
  # (I/O-bound temp-SQLite churn, see `config` above) and tracing is pure
  # overhead on top; the coverage NUMBER does not depend on the OS the way the
  # suite's pass/fail does, so one 1x runner measures and the matrix gates.
  # MEASURED on the dev box (Windows 11, CPython 3.12, same commands, 1260
  # tests): discover pass under coverage 311 s vs plain 313 s and 378 s on two
  # plain runs — the overhead is below the suite's own run-to-run variance
  # (it is I/O-bound, not CPU-bound); pytest pass 7 s vs 3 s. Baseline on the
  # dev box: 76.7 % combined line+branch (78.4 % lines, 71.7 % branches, 59
  # files). On THIS runner (first green run, 2026-09-01): 75.9 % combined
  # (77.5 % lines, 71.0 % branches) — lower because 19 Windows-only pytest
  # cases skip on ubuntu. The floor tracks the runner's number, not the dev
  # box's: 75.0. Wall time of this job on that run: 79 s.
  #
  # Both passes — the stdlib `unittest discover` run AND the pytest-style
  # modules — feed ONE data file (`coverage run`, then `coverage run -a`), so
  # the total is the suite's total, not one half of it. What is measured
  # (source = memsom/ only, branch = true, tests/_weights/_build omitted) is
  # configured in pyproject.toml [tool.coverage.*], NOT here, so a local
  # `python -m coverage run -m unittest discover -s . -p "test_*.py"` measures
  # the same thing.
  #
  # The floor is [tool.coverage.report] fail_under in pyproject.toml: the
  # MEASURED baseline minus ~1 point (ratchet — may rise, re-baseline in the
  # same commit; may never fall). `coverage report` exits 2 and prints
  # "Coverage failure: total of X is less than fail-under=Y" — the measured
  # number and the floor, by name. No continue-on-error anywhere in this job;
  # the summary and artifact steps run on `!cancelled()` so a red floor still
  # leaves the numbers where they can be read.
  #
  # Known undercount, stated rather than hidden: tests that drive the CLI
  # through `subprocess` exercise code this in-process tracer does not see, so
  # the number is a floor on what the suite executes, not a ceiling.
  # ---------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # coverage ONLY at this point — pytest is installed after the discover
      # pass, same order as the `unittest` job and for the same reason: the
      # pytest-style modules raise SkipTest when `import pytest` fails, and
      # with pytest importable their xfail-marked cases run as plain unittest
      # cases and FAIL (measured on the dev box, where pytest is installed:
      # 2 failures in test_seam_s4_*). Order is load-bearing.
      - name: Install coverage
        run: python -m pip install --quiet coverage

      - name: Suite under coverage (stdlib discover pass)
        run: python -W error::DeprecationWarning -m coverage run -m unittest discover -s . -p "test_*.py"

      # Same DERIVED module list as the `unittest` job's pytest step, appended
      # (-a) to the same data file.
      - name: Suite under coverage (pytest-style modules, appended)
        shell: bash
        run: |
          python -m pip install --quiet pytest
          files=$(grep -l "import pytest" tests/test_*.py)
          if [ -z "$files" ]; then
            echo "::error::grep found no pytest-style modules but this step exists — list derivation broke"
            exit 1
          fi
          python -W error::DeprecationWarning -m coverage run -a -m pytest -q $files

      # xml + html first so the artifact exists even when `report` trips the
      # floor; `report` last because it is the step that fails.
      - name: Coverage report (applies pyproject fail_under — the floor)
        run: |
          python -m coverage xml
          python -m coverage html
          python -m coverage report

      - name: Write totals to the job summary
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, re, sys, tomllib, xml.etree.ElementTree as ET
          if not os.path.exists("coverage.xml"):
              print("::error::coverage.xml missing — the suite did not get as far as producing a report")
              sys.exit(1)
          root = ET.parse("coverage.xml").getroot()
          lines = float(root.get("line-rate")) * 100
          branches = float(root.get("branch-rate")) * 100
          # coverage.py's TOTAL with branch=true is (hit lines + hit branches)
          # over (lines + branches) — THAT is the number fail_under applies to.
          lv, lc = int(root.get("lines-valid")), int(root.get("lines-covered"))
          bv, bc = int(root.get("branches-valid")), int(root.get("branches-covered"))
          total = 100.0 * (lc + bc) / (lv + bv)
          with open("pyproject.toml", "rb") as f:
              floor = tomllib.load(f)["tool"]["coverage"]["report"]["fail_under"]
          rows = []
          for cls in root.iter("class"):
              fn = cls.get("filename")
              n = len(cls.findall("./lines/line"))
              if n:
                  rows.append((float(cls.get("line-rate")) * 100, n, fn))
          rows.sort(key=lambda r: (r[0], -r[1]))
          out = [
              "## Coverage — memsom/ (line + branch, both test passes)",
              "",
              "| metric | value |",
              "|---|---|",
              f"| total (line+branch — what fail_under applies to) | **{total:.1f} %** |",
              f"| lines | {lines:.1f} % ({lc}/{lv}) |",
              f"| branches | {branches:.1f} % ({bc}/{bv}) |",
              f"| floor (pyproject fail_under) | {floor} % |",
              f"| verdict | {'GREEN' if total >= floor else 'RED — below floor'} |",
              "",
              f"Total `{total:.1f} %` vs floor `{floor} %` (files measured: {len(rows)}).",
              "",
              "### 10 lowest-covered production modules",
              "",
              "| lines % | statements | module |",
              "|---:|---:|---|",
          ]
          out += [f"| {r[0]:.1f} | {r[1]} | `{r[2]}` |" for r in rows[:10]]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)

      - name: Upload the html + xml report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-memsom
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
          if-no-files-found: error

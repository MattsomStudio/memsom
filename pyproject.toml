# memsom packaging — memsom/ package layout.
#
# Core lives in memsom/__init__.py, so `import memsom` still resolves the core
# API unchanged. The rest of the stack is grouped into subpackages
# (storage/ retrieval/ integrity/ lifecycle/ bridge/ federation/ distill/
# interface/). Internal imports use `from memsom.<group> import <mod>`.
# The wheel ships the whole memsom/ package (including the co-located
# external_fallback.txt data file) plus the bundled claude/ memory loop.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memsom"
version = "0.2.0"
description = "Derivation-DAG memory store for AI agents: provenance edges, channel-stamped Biba integrity labels, revoke-cascade, taint tracking. Stdlib-only."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Somanlall" }]
keywords = ["memory", "provenance", "dag", "agents", "integrity", "biba"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
]
# ZERO runtime dependencies — memsom is stdlib-only.  The optional Ollama
# integration is reached over urllib at runtime and is NOT a pip dependency.
dependencies = []

[project.optional-dependencies]
# Best-quality retrieval: the BGE-M3 triple-fusion backend (dense + learned
# sparse + ColBERT late-interaction re-rank). Opt-in ONLY — the core stays
# zero-dependency and falls back to Ollama/BM25 if these are absent. FlagEmbedding
# pulls torch + transformers transitively (multi-GB). For CUDA acceleration,
# install a matching torch build first (see README). Enable at runtime with
# MEMDAG_EMBED_BACKEND=bge-m3.
# Floor is the version this backend is verified against (the BGE service the
# author runs); the code uses the `devices=` constructor kwarg, which this line
# is known to accept. Bump only after re-testing.
bge = ["FlagEmbedding>=1.4.0"]

# NOTE -- the `telemetry` extra was REMOVED on 2026-07-31 along with
# memsom/interface/telemetry.py, which moved into memsom-panel
# (memsom_panel/telemetry.py). It had zero consumers in this package and three
# in the panel; it was 421 lines of subprocess/psutil/ctypes/urllib living in
# the top layer of a store this file's own comments describe as zero-dependency
# and stdlib-only. An extra that installs psutil for a module that is no longer
# here would be a deprecation notice with a package manager attached.
# `pip install memsom-panel[telemetry]` is where that dependency lives now.

# NOTE — the `panel` and `agents` extras were REMOVED at the 2026-07-30 split.
# The panel server, the model-backend adapters, and the LangGraph agent canvas
# now live in the separate memsom-panel package (repo: memsom-agentic-os), and
# attach to this CLI through the `memsom.commands` entry-point group rather
# than by import. See _register_plugin_commands() in memsom/interface/cli.py.
# `pip install memsom-panel` restores the `memsom panel` subcommand.

[project.urls]
Repository = "https://github.com/MattsomStudio/memsom"

[project.scripts]
memsom = "memsom.interface.cli:main"
memsom-mcp = "memsom.interface.mcp:main"
memsom-broker = "memsom.federation.broker:main"

# ---------------------------------------------------------------------------
# Wheel: the whole memsom/ package. external_fallback.txt lives inside
# memsom/ and ships as package data; the CLI resolves it via
# Path(memsom.__file__).parent / "external_fallback.txt" after install.
# Tests/, _build/, _weights/, *.db, bench/, demo/ are excluded by construction.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["memsom"]

# Bundled Claude Code memory loop (skills + CLAUDE.md template) so a standalone
# `pip install` + `memsom wire-claude` finds them without a repo clone. The CLI
# resolves them relative to the installed package (site-packages/claude/...).
[tool.hatch.build.targets.wheel.force-include]
"claude" = "claude"

# ---------------------------------------------------------------------------
# sdist: the memsom/ package (incl. external_fallback.txt) + the bundled
# claude/ loop. README/LICENSE/pyproject.toml are added automatically.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.sdist]
only-include = [
    "memsom",
    "claude",
]

# ---------------------------------------------------------------------------
# Coverage (coverage.py). The `coverage` job in .github/workflows/tests.yml
# runs the stdlib `unittest discover` pass and the pytest-style pass into ONE
# data file (`coverage run` then `coverage run -a`) and applies `fail_under`
# with `coverage report`. Everything that decides WHAT is measured lives here,
# not on the CI command line, so a local
#     python -m coverage run -m unittest discover -s . -p "test_*.py"
#     python -m coverage report
# measures exactly what CI measures.
#
# Only the production package counts. tests/, _weights/ (vendored llama.cpp),
# _build/, bench/, demo/, scripts/ are outside `source` by construction and
# omitted again explicitly so a stray import path cannot pull them in.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["memsom"]
branch = true
omit = [
    "tests/*",
    "_weights/*",
    "_build/*",
    "_pkgtest_venv/*",
    "bench/*",
    "demo/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 1
skip_empty = true
# FLOOR, not a target. Ratchet semantics, same argument as the panel repo's
# test-count floor and arch/dup ratchets: the number may RISE (re-baseline in
# the same commit) and may never FALL. Set at the MEASURED baseline minus ~1
# point (see the coverage job's comment in tests.yml for the measurement —
# the baseline is the UBUNTU runner's 75.9 %, not the dev box's 76.7 %, because
# the runner is where the floor applies) so CI is green today and cannot
# silently regress. `coverage report` exits 2 and
# prints "Coverage failure: total of X is less than fail-under=Y" — by name.
fail_under = 75.0

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
